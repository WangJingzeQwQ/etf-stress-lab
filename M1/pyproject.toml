[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-stress-m1"
version = "0.2.0"
description = "Point-in-time ETF data infrastructure and stress-testing core (M1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "pytest>=8.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
data-provider = [
  "akshare>=1.14",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

