name: core-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m0-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: M0/pyproject.toml
      - name: Install M0
        working-directory: M0
        run: python -m pip install -e .
      - name: Run M0 tests
        working-directory: M0
        run: python -m pytest -q -p no:cacheprovider

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: M2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: M2/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
