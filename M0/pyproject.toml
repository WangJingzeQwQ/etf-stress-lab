[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-stress-m0"
version = "0.1.0"
description = "Auditable ETF stress-testing core vertical slice (M0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pytest>=8.0",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

