[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-stress-m2"
version = "1.0.0"
description = "Point-in-time ETF stress backtesting, PPO research and dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "lightgbm>=4.0",
  "pandas>=2.0",
  "pytest>=8.0",
  "PyYAML>=6.0",
  "torch>=2.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
data-provider = [
  "akshare>=1.14",
]

api-test = [
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

